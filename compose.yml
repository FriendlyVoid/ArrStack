services:

######## MEDIA PLAYERS ########

  plex: # media server for streaming movies and tv
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    networks:
      - arrstack
    ports:
      - 32400:32400/tcp
      # the below ports are optional and rarely needed. check plex documentation for more info
      # - 8324:8324/tcp    
      # - 32469:32469/tcp
      # - 1900:1900/udp
      # - 32410:32410/udp
      # - 32412:32412/udp
      # - 32413:32413/udp
      # - 32414:32414/udp
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ${APPDATA_FOLDER}/plex:/config
      - ${MEDIA_SHARE}:/media
      - /dev/shm:/transcode  # /dev/shm is used for transcoding in RAM. if your server has low RAM,set a limit or change to a path on a (solid state) disk
    restart: unless-stopped

