######## DOWNLOADERS ########

  sabnzbd: # usenet downloader - more info here: https://www.reddit.com/r/usenet/comments/18q7r0f/usenet_starter_guide/ and in "starter guide.txt" file
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_FOLDER}/sabnzbd:/config
      - ${MEDIA_SHARE}:/media
    networks:
      - arrstack
    ports:
      - ${SABNZBD_WEBUI_PORT}:8080
    restart: always

